[package]
name = "ledger-cli"
description = "Ledger hardware wallet command line interface"
keywords = [ "ledger", "wallet", "cli" ]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
rust-version.workspace = true

[features]
transport_usb_libusb = [ "ledger-lib/transport_usb_libusb" ]
transport_usb_hidraw = [ "ledger-lib/transport_usb_hidraw" ]

# Same default as in lib/Cargo.toml
default = [ "transport_usb_libusb" ]

[dependencies]
clap = { workspace = true, features = [ "derive" ] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["full"] }
time = { version = "0.3", features = [ "macros" ] }
humantime = "2.1"
hex = { workspace = true }
serde_json = { workspace = true }

ledger-lib = { workspace = true, features = [ "clap", "transport_usb", "transport_tcp", "transport_ble" ] }
ledger-proto = { workspace = true, default-features = true }
