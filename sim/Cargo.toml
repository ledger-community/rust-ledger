[package]
name = "ledger-sim"
description = "A Rust wrapper for the Ledger Speculos Simulator"
keywords = [ "ledger", "hardware", "wallet", "speculos", "simulator" ]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.2"
strum = { workspace = true, features = [ "derive" ] }
anyhow = { workspace = true }
clap = { workspace = true, features = [ "derive", "env" ] }
tokio = { workspace = true, features = [ "full" ] }
lazy_static = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
bollard = "0.19.4"
async-trait = { workspace = true }
futures = { workspace = true }
tar = "0.4"
reqwest = { version = "0.11", features = [ "json", "rustls-tls" ], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
image = "0.25"

[dev-dependencies]
ledger-lib = { workspace = true, default-features = true }
ledger-proto = { workspace = true, default-features = true }
